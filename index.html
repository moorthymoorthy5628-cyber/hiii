<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1 id="title">🎉 Happy Birthday! 🎂</h1>
        <p id="message">Wishing you a day filled with happiness and a year filled with joy.</p>
        <button class="btn" onclick="changeWish()">Click for Surprise</button>
    </div>

    <script>
        const messages = [
            "May all your dreams turn into reality this year! 🌟",
            "Keep smiling and shining bright always! ✨",
            "Have a fantastic day and an amazing year ahead! 🎁",
            "Cheers to another wonderful year of your life! 🥂"
        ];

        function changeWish() {
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('message').innerText = randomMsg;
        }
    </script>

</body>
</html>
